<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->
<!-- Parh to create os copy this file = /etc/dbus-1/system.d/com.example.SystemMaintenance.conf -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- 1. Only the 'root' user is allowed to own this service name on the System Bus -->
  <policy user="root">
    <allow own="com.example.SystemMaintenance"/>
  </policy>

  <!-- 2. Any regular user on the system is allowed to send messages to this service -->
  <!-- Note: Fine-grained method authorization will be handled by Polkit inside the daemon -->
  <policy context="default">
    <allow send_destination="com.example.SystemMaintenance"/>
    <allow receive_sender="com.example.SystemMaintenance"/>
  </policy>

</busconfig>